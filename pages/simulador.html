<!doctype html><html lang='es'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>Simulador</title><link rel='stylesheet' href='../css/style.css'><script defer src='../js/simulador.js'></script></head><body><header class='site-header'><nav class='nav'><a class='nav-link' href='../index.html'>Inicio</a><a class='nav-link active' href='./simulador.html' aria-current='page'>Simulador</a></nav><h1>Simulador de Alquiler</h1><p class='subtitle'>Seleccioná un vehículo, elegí días y agregalo a tus reservas.</p></header><main class='container sim-wrap'><form id='filtrosForm' class='filters'><input id='buscador' type='search' placeholder='Buscar por marca o modelo…'><select id='filtroCategoria'><option value=''>Todas las categorías</option><option>Compacto</option><option>Midsize</option><option>SUV</option><option>Eléctrico</option></select><button class='btn primary' type='submit'>Aplicar</button><button class='btn ghost' id='btnReset' type='button'>Limpiar filtros</button></form><div class='grid-2col'><section><h2>Catálogo</h2><div id='catalogoGrid' class='grid-cards'></div><p id='msgCatalogo' class='muted'></p></section><aside class='panel'><div class='panel-head'><h2>Mis reservas</h2><button class='btn ghost' id='btnVaciar'>Vaciar</button></div><div id='reservasLista' class='stack'></div><div class='totales'><span>Total</span><strong id='totalAcumulado'>USD 0.00</strong></div><p id='msgUI' class='msg'></p></aside></div></main></body></html>
